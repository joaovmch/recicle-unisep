<div class="cooperativa-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">
        <img src="/logo.png" alt="Re-cicle" />
      </div>

      <div>
        <div class="brand-name">Re-cicle</div>
        <div class="brand-subtitle">painel do parceiro</div>
      </div>
    </div>

    <!-- Antes da aprovação só documentos abre (o guard manda o resto pra tela de análise),
         então o menu mostra só o que a cooperativa consegue de fato acessar. -->
    <nav class="sidebar-menu">
      @if (aprovada()) {
        <a class="menu-item" routerLink="dashboard" routerLinkActive="active">Visão geral</a>
        <a class="menu-item" routerLink="solicitacoes" routerLinkActive="active">Solicitações</a>
        <a class="menu-item" routerLink="residuos" routerLinkActive="active">Tipos de resíduo</a>
        <a class="menu-item" routerLink="area-cobertura" routerLinkActive="active">Área de cobertura</a>
        <a class="menu-item" routerLink="equipe" routerLinkActive="active">Equipe e veículos</a>
      }
      <a class="menu-item" routerLink="documentos" routerLinkActive="active">Documentos e licença</a>
      @if (aprovada()) {
        <a class="menu-item" routerLink="relatorios" routerLinkActive="active">Relatórios</a>
      }
    </nav>

    <div class="sidebar-rodape">
      <div class="cooperativa-card">
        <strong>{{ cooperativa()?.nome ?? 'Sua cooperativa' }}</strong>
        <span class="licenca">{{ statusInfo().texto }}</span>
      </div>

      <button class="logout-btn" (click)="sair()">Sair da conta</button>
    </div>

  </aside>


  <!-- CONTEÚDO -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
